<script type="text/babel">
/* ===== schedule-wizard.jsx ===== */
// Мастер «Заполнить месяц» — паттерн смен → предпросмотр
// =====================================================================
// Самая новая часть спеца «График работы»: вместо ручного проставления
// смен по дням машинист задаёт ПАТТЕРН (2/2, 5/2, свой цикл) и точку
// старта — приложение раскладывает смены на весь месяц.
//
// Экраны (артборды):
//   • Шаг 1 — выбор паттерна + время смены
//   • Шаг 1 «Свой» — редактор цикла смен + пикер типа дня + времена
//   • Шаг 2 — первый день цикла + предпросмотр месяца
//
// Используем токены приложения: дневная смена — синий accent, ночная —
// глубокий сине-стальной (та же гамма, темнее), явка — зелёная,
// больничный — красный, выходной — серый. Без эмодзи: чистые SVG-глифы.

// ── Семантика типов смен ─────────────────────────────────────
function shiftColors(t, dark = false) {
  // День — белая плашка (surface), ночь — чёрная. В тёмной теме
  // ночь осветляем до светло-серого, иначе глиф не читается на тёмном фоне.
  const night = dark ? '#D4D7DD' : '#1A1F2B';
  const dayInk = dark ? '#E8EAED' : '#1A1F2B';
  // stroke — хайрлайн для заливок (белый день нужно обвести, иначе теряется
  // на белой карточке). mark — цвет для подписей/точек/глифов НА светлом фоне
  // (для дня белый не читается → берём тёмный).
  return {
    day:   { solid: t.surface, soft: dark ? 'rgba(255,255,255,0.10)' : 'rgba(10,14,20,0.05)', ink: dayInk, stroke: t.borderStrong, mark: dayInk, label: 'Дневная', short: 'Дн' },
    night: { solid: night,     soft: dark ? 'rgba(212,215,221,0.16)' : 'rgba(26,31,43,0.12)', ink: dark ? '#0A0E14' : '#fff', stroke: 'transparent', mark: night, label: 'Ночная',  short: 'Ноч' },
    duty:  { solid: '#1F9D55', soft: 'rgba(31,157,85,0.14)',  ink: '#fff', stroke: 'transparent', mark: '#1F9D55', label: 'Явка',    short: 'Яв'  },
    off:   { solid: t.textFaint, soft: t.bgSubtle,            ink: t.textMuted, stroke: 'transparent', mark: t.textFaint, label: 'Выходной', short: 'Вых' },
    sick:  { solid: '#E2483D', soft: 'rgba(226,72,61,0.12)',  ink: '#fff', stroke: 'transparent', mark: '#E2483D', label: 'Больничный', short: 'Б' },
  };
}

// ── Глифы типов смен ─────────────────────────────────────────
function ShiftGlyph({ type, size = 18, color = 'currentColor' }) {
  const common = { width: size, height: size, viewBox: '0 0 24 24', fill: 'none',
    stroke: color, strokeWidth: 2, strokeLinecap: 'round', strokeLinejoin: 'round' };
  if (type === 'day') return (
    <svg {...common}>
      <circle cx="12" cy="12" r="4.5"/>
      <path d="M12 2v2.5M12 19.5V22M3.5 12H6M18 12h2.5M5.6 5.6l1.8 1.8M16.6 16.6l1.8 1.8M5.6 18.4l1.8-1.8M16.6 7.4l1.8-1.8"/>
    </svg>
  );
  if (type === 'night') return (
    <svg {...common}>
      <path d="M20 13.5A8 8 0 1 1 10.5 4a6.5 6.5 0 0 0 9.5 9.5z"/>
    </svg>
  );
  if (type === 'duty') return (
    <svg {...common}>
      <rect x="5" y="3" width="14" height="18" rx="2.5"/>
      <path d="M9 8h6M9 12h6M9 16h3"/>
    </svg>
  );
  // off — короткое тире
  return (
    <svg {...common}><path d="M6 12h12"/></svg>
  );
}

// ── Пресеты паттернов ────────────────────────────────────────
const PATTERNS = [
  { id: '2-2', big: '2 / 2', sub: '2 работа, 2 отдых' },
  { id: '5-2', big: '5 / 2', sub: 'Пн–пт, выходные' },
  { id: '3-3', big: '3 / 3', sub: '3 через 3' },
  { id: 'custom', big: 'Свой', sub: 'Настроить вручную' },
];

// Цикл по умолчанию для «Свой»: день, ночь, выходной, выходной
const DEFAULT_CYCLE = ['day', 'night', 'off', 'off'];

// ═════════════════════════════════════════════════════════════
// ГЛАВНЫЙ КОМПОНЕНТ
// ═════════════════════════════════════════════════════════════
function ScheduleWizardScreen({
  dark = false,
  step = 1,                 // 1 | 2
  pattern = '2-2',          // id паттерна
  cycle = DEFAULT_CYCLE,    // массив типов для custom
  pickerIndex = null,       // индекс квадрата цикла, для которого открыт пикер типа
  firstDay = 1,             // выбранный первый день цикла (для шага 2)
  editMode = false,         // режим редактирования карточек смен (для custom)
  confirm = null,           // 'day' | 'pattern' — показать диалог подтверждения удаления
  confirmDay = 1,           // номер дня для диалога удаления дня
  platform = 'ios',         // 'ios' | 'android' — хром устройства
  height = 852,             // высота устройства — растим, если не помещается
}) {
  const t = dark ? M.dark : M.light;
  const SC = shiftColors(t, dark);
  const isCustom = pattern === 'custom';

  return (
    <MDevice dark={dark} height={height} platform={platform}>
      <div style={{ paddingTop: 58, height: '100%', display: 'flex', flexDirection: 'column' }}>
        {/* Навбар */}
        <div style={{
          padding: '8px 12px 6px',
          display: 'grid', gridTemplateColumns: 'auto 1fr auto', alignItems: 'center', gap: 4,
        }}>
          <button style={{ ...pillBtn(t, { px: 12, h: 36 }), gap: 4 }}>
            <IcChevronLeft width="15" height="15"/>
            <span style={{ fontSize: 14, fontWeight: 600 }}>Апрель</span>
          </button>
          <div style={{ textAlign: 'center', fontSize: 16, fontWeight: 700, color: t.text }}>
            Заполнить месяц
          </div>
          <div style={{ width: 36 }}/>
        </div>

        {/* Индикатор шагов */}
        <StepRail t={t} step={step}/>

        {/* Контент шага */}
        <div style={{ flex: 1, overflowY: 'auto', padding: '4px 16px 20px' }}>
          {step === 1
            ? <WizardStep1 t={t} SC={SC} pattern={pattern} cycle={cycle} pickerIndex={pickerIndex} isCustom={isCustom} editMode={editMode}/>
            : <WizardStep2 t={t} SC={SC} cycle={isCustom ? cycle : patternToCycle(pattern)} firstDay={firstDay}/>
          }
        </div>

        {/* Нижняя кнопка */}
        <div style={{
          padding: '10px 16px 26px',
          borderTop: `1px solid ${t.border}`, background: t.bg,
          display: 'flex', gap: 10,
        }}>
          {step === 2 && (
            <button style={{
              height: 50, padding: '0 18px', borderRadius: 14,
              background: t.surface, color: t.text, border: `1px solid ${t.borderStrong}`,

          <button style={{
            flex: 1, height: 50, borderRadius: 14,

            fontSize: 16, fontWeight: 700, cursor: 'pointer',

            boxShadow: '0 4px 12px rgba(0,160,245,0.25)',
          }}>
            {step === 1 ? 'Далее' : 'Применить'}
            {step === 1 && (
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
            )}

      {/* Диалог подтверждения удаления */}

    </MDevice>
  );
}

// ── Диалог подтверждения удаления (день / весь паттерн) ───────
function ConfirmDeleteDialog({ t, kind, dayNum = 1 }) {
  const isPattern = kind === 'pattern';
  const title = isPattern ? 'Удалить весь паттерн?' : `Удалить день ${dayNum}?`;
  const body = isPattern
    ? 'Цикл смен будет полностью очищен. Это действие нельзя отменить — паттерн придётся собрать заново.'
    : `День ${dayNum} будет убран из цикла, а следующие дни сдвинутся. Раскладку смен на месяц нужно будет применить заново.`;
  const confirmLabel = isPattern ? 'Удалить паттерн' : 'Удалить день';
  const danger = t.danger || '#E2483D';
  return (
    <div style={{
      position: 'absolute', inset: 0, zIndex: 80,
      display: 'flex', alignItems: 'center', justifyContent: 'center',
      padding: 24, background: 'rgba(8,12,20,0.5)', backdropFilter: 'blur(2px)',

          width: 56, height: 56, borderRadius: 28, marginBottom: 14,

          display: 'flex', alignItems: 'center', justifyContent: 'center',
        }}>
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke={danger} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
            <path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m2 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M10 11v6M14 11v6"/>
          </svg>
        </div>
        <div style={{ fontSize: 18, fontWeight: 700, color: t.text, marginBottom: 8 }}>{title}</div>
        <div style={{ fontSize: 13.5, lineHeight: 1.45, color: t.textMuted, marginBottom: 20 }}>{body}</div>
        <button style={{
          width: '100%', height: 50, borderRadius: 14, border: 'none', cursor: 'pointer',
          background: danger, color: '#fff', fontSize: 15.5, fontWeight: 700,
          display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 8,
          boxShadow: `0 6px 16px ${hexToRgba(danger, 0.3)}`,
        }}>
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
            <path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m2 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M10 11v6M14 11v6"/>
          </svg>
          {confirmLabel}
        </button>
        <button style={{
          width: '100%', height: 48, borderRadius: 14, marginTop: 10, cursor: 'pointer',
          background: 'transparent', color: t.text, border: `1px solid ${t.border}`,
          fontSize: 15, fontWeight: 600,
        }}>
          Отмена
        </button>
      </div>
    </div>
  );
}

// Индикатор шагов ①—②
function StepRail({ t, step }) {
  const Dot = ({ n, done, active }) => (
    <div style={{
      width: 26, height: 26, borderRadius: 13,
      background: done ? t.accent : active ? t.accent : t.bgSubtle,
      color: done || active ? '#fff' : t.textMuted,
      display: 'flex', alignItems: 'center', justifyContent: 'center',
      fontFamily: M.fontMono, fontWeight: 700, fontSize: 13,
      border: active && !done ? `none` : 'none',
    }}>
      {done ? (
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3.5" strokeLinecap="round" strokeLinejoin="round"><path d="M5 12l5 5L20 7"/></svg>
      ) : n}
    </div>
  );
  const labels = ['Паттерн', 'Старт и предпросмотр'];
  return (
    <div style={{
      display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 10,
      padding: '4px 16px 10px',
    }}>
      <Dot n={1} done={step > 1} active={step === 1}/>
      <span style={{ fontSize: 12, fontWeight: 600, color: step === 1 ? t.text : t.textMuted }}>{labels[0]}</span>
      <div style={{ width: 28, height: 2, borderRadius: 1, background: step > 1 ? t.accent : t.bgSubtle }}/>
      <Dot n={2} done={false} active={step === 2}/>
      <span style={{ fontSize: 12, fontWeight: 600, color: step === 2 ? t.text : t.textMuted }}>{labels[1]}</span>
    </div>
  );
}

// Преобразование пресета в массив-цикл (для предпросмотра)
function patternToCycle(id) {
  if (id === '2-2') return ['day', 'day', 'off', 'off'];
  if (id === '5-2') return ['day', 'day', 'day', 'day', 'day', 'off', 'off'];
  if (id === '3-3') return ['day', 'day', 'day', 'off', 'off', 'off'];
  return DEFAULT_CYCLE;
}

// ПРОДЛЕНИЕ — модальный лист (по нажатию «Продлить срок»)

}

// ═══════════════════════════════════════════════════════════════
// ИСТЕКЛА — подписка была куплена и закончилась (возобновление)
// ═══════════════════════════════════════════════════════════════
function IOSPaywallExpired({ dark = false, height = 1040, selected = 'year', expiredOn = '12.05.2026' }) {

}

// ═══════════════════════════════════════════════════════════════
// СКОРО ИСТЕЧЁТ — push-уведомление на экране блокировки (за N дней)

function IOSExpiringSoon({ dark = false, height = 1040, daysLeft = 3, renewsOn = '14.02.2027' }) {

        <div style={{
          background: 'rgba(28,30,36,0.72)', backdropFilter: 'blur(24px)', WebkitBackdropFilter: 'blur(24px)',
          borderRadius: 22, padding: '14px 15px', boxShadow: '0 18px 44px rgba(0,0,0,0.4)',
          border: '1px solid rgba(255,255,255,0.08)',
        }}>
          <div style={{ display: 'flex', alignItems: 'center', gap: 12 }}>
            <div style={{ width: 40, height: 40, borderRadius: 10, background: t.warning, color: '#1b1300', display: 'flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0 }}>
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.4" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v4l3 2"/></svg>
            </div>
            <div style={{ flex: 1, minWidth: 0 }}>
              <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline' }}>
                <span style={{ fontFamily: M.fontSans, fontSize: 14, fontWeight: 700, color: '#fff' }}>Машинист</span>
                <span style={{ fontFamily: M.fontMono, fontSize: 11, color: 'rgba(255,255,255,0.5)' }}>сейчас</span>
              </div>
              <div style={{ fontFamily: M.fontSans, fontSize: 14, fontWeight: 600, color: '#fff', marginTop: 3, lineHeight: 1.3 }}>Подписка истекает через {daysLeft} дня</div>
            </div>
          </div>
          <div style={{ fontFamily: M.fontSans, fontSize: 13.5, color: 'rgba(255,255,255,0.82)', marginTop: 9, lineHeight: 1.42 }}>
            Срок действия закончится {renewsOn}. Продлите заранее — новый период прибавится к&nbsp;текущему, дни не&nbsp;сгорают.
          </div>
        </div>
        <div style={{ textAlign: 'center', marginTop: 14, fontFamily: M.fontSans, fontSize: 13, fontWeight: 500, color: 'rgba(255,255,255,0.6)' }}>
          Нажмите, чтобы продлить
        </div>
      </div>
    </MDevice>
  );
}

Object.assign(window, {
  IOSPaywallA, IOSPaywallCompare, IOSPaywallUnlock, IOSPaywallB, IOSPaywallC, IOSProManage,
  IOSRenewSheet, IOSPaywallExpired, IOSExpiringSoon,
  ProHero, FeatureRow, PlanCard,
});

</script>
<script type="text/babel">
/* ===== login-screens.jsx ===== */
// ═══════════════════════════════════════════════════════════════
// ВХОД / РЕГИСТРАЦИЯ / ВОССТАНОВЛЕНИЕ ПАРОЛЯ — iOS light
// Логика приложения:
//   • вход по e-mail + паролю и через VK ID
//   • переключатель Вход / Регистрация (сегмент-контрол сверху)
//   • восстановление: пользователь вводит почту → на неё уходит
//     письмо со ссылкой для смены пароля (без кода — код не приходит)
//
// mode: 'login' | 'register' | 'recover' | 'sent'
// ═══════════════════════════════════════════════════════════════

const DEMO_EMAIL = 's.kuznetsov@mail.ru';

// ── доп. иконки (нет в icons.jsx / profile-screens.jsx) ──────────
const _aIco = {
  width: 24, height: 24, viewBox: '0 0 24 24',
  fill: 'none', stroke: 'currentColor', strokeWidth: 1.4,
  strokeLinecap: 'round', strokeLinejoin: 'round',
};
function IcEye(p) { return (
  <svg {..._aIco} {...p}>
    <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/>
    <circle cx="12" cy="12" r="3"/>
  </svg>
); }
function IcEyeOff(p) { return (
  <svg {..._aIco} {...p}>
    <path d="M10.6 6.1A9.7 9.7 0 0 1 12 6c6.5 0 10 6 10 6a17 17 0 0 1-3.2 3.7M6.3 7.6A17 17 0 0 0 2 12s3.5 6 10 6a9.6 9.6 0 0 0 4-.8"/>
    <path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/>
    <path d="M3 3l18 18"/>
  </svg>
); }
function IcPaperPlane(p) { return (
  <svg {..._aIco} {...p}>
    <path d="M21 4L3 11l6 2.5L11 20l3.5-6L21 4z"/>
    <path d="M9 13.5L21 4"/>
  </svg>
); }
function IcMailOpen(p) { return (
  <svg {..._aIco} {...p}>
    <path d="M3 9.5L12 4l9 5.5V19a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z"/>
    <path d="M3 9.5l9 6 9-6"/>
  </svg>
); }
function IcAlert(p) { return (
  <svg {..._aIco} {...p}>
    <circle cx="12" cy="12" r="9"/>
    <path d="M12 8v4.5"/>
    <path d="M12 16h.01"/>
  </svg>
); }

// ── сегмент-контрол Вход / Регистрация ──────────────────────────
function AuthSegment({ t, value, onChange }) {
  const items = [['login', 'Вход'], ['register', 'Регистрация']];
  return (
    <div style={{
      display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 4,
      background: t.bgSubtle, borderRadius: 12, padding: 4,
    }}>
      {items.map(([key, label]) => {
        const active = value === key;
        return (
          <button key={key} onClick={() => onChange && onChange(key)} style={{
            height: 38, borderRadius: 9, border: 'none', cursor: 'pointer',
            background: active ? t.surface : 'transparent',
            boxShadow: active ? M.shadow.sm : 'none',
            color: active ? t.text : t.textMuted,
            fontFamily: M.fontSans, fontSize: 15, fontWeight: 600,
            transition: 'all .15s ease',
          }}>{label}</button>
        );
      })}
    </div>
  );
}

// ── поле ввода (иконка + лейбл + значение + caret/eye) ───────────
function AuthField({ t, icon, label, value, placeholder, focused, mono, trailing, error, errColor }) {
  const ec = errColor || t.danger;
  const borderColor = error ? ec : focused ? t.accent : t.border;
  const iconColor = error ? ec : focused ? t.accent : t.textMuted;
  return (
    <div>
      <div style={{ ...M.t.label(t), marginBottom: 7, paddingLeft: 2 }}>{label}</div>
      <div style={{
        background: t.surface, borderRadius: 14,
        boxShadow: error ? `0 0 0 3px ${ec}24` : M.shadow.sm,
        border: `1.5px solid ${borderColor}`,
        padding: '0 14px', height: 52, display: 'flex', alignItems: 'center', gap: 10,
      }}>
        {React.cloneElement(icon, { width: 20, height: 20, style: { color: iconColor, flexShrink: 0 } })}
        <span style={{
          flex: 1, minWidth: 0,
          fontFamily: mono ? M.fontMono : M.fontSans, fontSize: 16,
          color: value ? t.text : t.textFaint, letterSpacing: mono ? 2 : 0,
          whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis',
        }}>{value || placeholder}</span>
        {focused && <span style={{ width: 2, height: 22, background: t.accent, flexShrink: 0 }}/>}
        {trailing}
      </div>
    </div>
  );
}

function authCta(t, disabled) {
  return {
    width: '100%', height: 52, borderRadius: 14, border: 'none',
    cursor: disabled ? 'default' : 'pointer',
    background: disabled ? t.bgSubtle : t.cta,
    color: disabled ? t.textFaint : t.ctaInk,
    fontFamily: M.fontSans, fontSize: 16, fontWeight: 600,
    boxShadow: disabled ? 'none' : M.shadow.sm,
  };
}

function authLink(t) {
  return {
    background: 'transparent', border: 'none', cursor: 'pointer', padding: 0,
    color: t.accent, fontFamily: M.fontSans, fontSize: 15, fontWeight: 500,
  };
}

function VKButton({ t }) {
  return (
    <button style={{
      width: '100%', height: 52, borderRadius: 14, border: 'none', cursor: 'pointer',
      background: '#0077FF', color: '#fff',
      display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 10,
      fontFamily: M.fontSans, fontSize: 16, fontWeight: 600,
    }}><IcVK size={22}/> Войти через VK&nbsp;ID</button>
  );
}

function AuthDivider({ t }) {
  return (
    <div style={{ display: 'flex', alignItems: 'center', gap: 12, margin: '20px 0' }}>
      <div style={{ flex: 1, height: 1, background: t.border }}/>
      <span style={{ ...M.t.captionMuted(t) }}>или</span>
      <div style={{ flex: 1, height: 1, background: t.border }}/>
    </div>
  );
}

// ── общий навбар экрана (закрыть ✕ / назад ‹) ───────────────────
function AuthNav({ t, back }) {
  return (
    <div style={{ paddingTop: 58 }}>
      <div style={{ padding: '12px 16px', display: 'flex', alignItems: 'center' }}>
        <button style={{
          width: 40, height: 40, borderRadius: 20, border: 'none',
          background: t.surface, boxShadow: M.shadow.sm, color: t.text,
          display: 'flex', alignItems: 'center', justifyContent: 'center', cursor: 'pointer',
        }}>{back
          ? <IcChevronLeft width={18} height={18}/>
          : <span style={{ fontSize: 17, lineHeight: 1 }}>✕</span>}</button>
      </div>
    </div>
  );
}

// ═══════════════════════════════════════════════════════════════
// ГЛАВНЫЙ КОМПОНЕНТ
// mode: 'login' | 'register' | 'recover' | 'sent'
// ═══════════════════════════════════════════════════════════════
function IOSAuth({ dark = false, height = 844, mode = 'login', focus = null, error = false }) {
  const t = dark ? M.dark : M.light;
  const isAuth = mode === 'login' || mode === 'register';
  const back = mode === 'recover' || mode === 'sent';

  const title = {
    login: 'Вход в Машинист',
    register: 'Создать аккаунт',
    recover: 'Забыли пароль?',
    sent: 'Письмо отправлено',
  }[mode];

  const hint = {
    login: null,
    register: null,
    recover: 'Укажите почту, на которую зарегистрирован аккаунт. Пришлём письмо со ссылкой для смены пароля.',
    sent: null,
  }[mode];

  return (
    <MDevice dark={dark} height={height}>
      <AuthNav t={t} back={back}/>

      <div style={{
        padding: '8px 24px 24px', height: 'calc(100% - 110px)',
        display: 'flex', flexDirection: 'column',
      }}>
        {/* ── Шапка: лого + заголовок ─────────────────────────── */}
        <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', textAlign: 'center', marginTop: 4 }}>
          {mode === 'sent' ? (
            <div style={{
              width: 72, height: 72, borderRadius: 24, background: t.accentSoft, color: t.accent,
              display: 'flex', alignItems: 'center', justifyContent: 'center',
            }}><IcMailOpen width={34} height={34}/></div>
          ) : (
            <div style={{
              width: 64, height: 64, borderRadius: 18, background: t.cta, color: t.ctaInk,
              display: 'flex', alignItems: 'center', justifyContent: 'center',
              fontFamily: M.fontDisplay, fontSize: 38, fontWeight: 800,
            }}>М</div>
          )}
          <div style={{
            fontFamily: M.fontDisplay, fontSize: 24, fontWeight: 800,
            color: t.text, letterSpacing: -0.5, marginTop: 16,
          }}>{title}</div>
          {hint && (
            <div style={{ ...M.t.hint(t), marginTop: 8, maxWidth: 290 }}>{hint}</div>
          )}
          {mode === 'sent' && (
            <div style={{ ...M.t.hint(t), marginTop: 8, maxWidth: 290 }}>
              Отправили ссылку для смены пароля на<br/>
              <span style={{ color: t.text, fontWeight: 600 }}>{DEMO_EMAIL}</span>.

            </div>
          )}

        {/* ── Тело экрана ──────────────────────────────────────── */}
        {isAuth && <AuthBody t={t} mode={mode} focus={focus} error={error}/>}

        {mode === 'sent' && <SentBody t={t}/>}
      </div>
    </MDevice>
  );
}

// ── ВХОД / РЕГИСТРАЦИЯ ──────────────────────────────────────────
function AuthBody({ t, mode, focus, error = false }) {
  const register = mode === 'register';
  const showErr = !register && error;
  const red = t === M.dark ? '#FF6575' : '#C81E14'; // насыщенный чистый красный — светлее в тёмной теме
  return (
    <>
      {/* Сегмент-переключатель */}
      <div style={{ marginTop: 22 }}>
        <AuthSegment t={t} value={mode}/>
      </div>

      {/* Баннер ошибки */}
      {showErr && (
        <div style={{
          marginTop: 16, display: 'flex', alignItems: 'flex-start', gap: 10,
          background: `${red}1F`, border: `1px solid ${red}57`,
          borderRadius: 14, padding: '12px 14px',
        }}>
          <IcAlert width={20} height={20} style={{ color: red, flexShrink: 0, marginTop: 1 }}/>
          <div>
            <div style={{ fontFamily: M.fontSans, fontSize: 15, fontWeight: 600, color: red }}>
              Неверная почта или пароль
            </div>
            <div style={{ fontFamily: M.fontSans, fontSize: 13, fontWeight: 400, color: t.textMuted, marginTop: 2, lineHeight: 1.4 }}>
              Проверьте данные и попробуйте снова.
            </div>
          </div>
        </div>
      )}

      {/* Поля */}
      <div style={{ marginTop: showErr ? 16 : 20, display: 'flex', flexDirection: 'column', gap: 14 }}>
        <AuthField
          t={t} icon={<IcMailP/>} label="Электронная почта"
          value={DEMO_EMAIL} placeholder="you@example.com"
          focused={focus === 'email'} error={showErr} errColor={red}
        />
        <AuthField
          t={t} icon={<IcLock/>} label="Пароль"
          value={register ? '••••••••' : '••••••••••'} placeholder="Минимум 8 символов"
          focused={focus === 'password'} error={showErr} errColor={red}
          trailing={<button style={{
            background: 'transparent', border: 'none', cursor: 'pointer', padding: 4,
            color: t.textMuted, display: 'flex', flexShrink: 0,
          }}><IcEyeOff width={20} height={20}/></button>}
        />
        {register && (
          <AuthField

/* ===== android-purchase.jsx ===== */
// ═══════════════════════════════════════════════════════════════
// ANDROID · ПОКУПКИ — Машинист Pro (Material 3)
// Вариант A (как и на iOS): витрина тарифов · активная подписка ·
// продление (Material bottom sheet) · подписка истекла.
//   • ADevice + Material small top app bar (✕ + «Восстановить»)
//   • Material outlined plan-cards с radio (tonal-заливка при выборе)

const A_PRO_FEATURES = [
  ['Облачная копия и синхронизация', <IcCloud/>],
  ['Экспорт в PDF', <IcPdf/>],
  ['Безлимит маршрутов и истории', <IcDocument/>],
];

// Material small top app bar для экранов покупки (✕ слева, текст-действие справа).
function APaywallTopBar({ t, restore = true }) {
  return (
    <div style={{ padding: '8px 4px', display: 'flex', alignItems: 'center', gap: 4, background: t.bg }}>
      <button style={{
        width: 48, height: 48, border: 'none', background: 'transparent', color: t.text,

      </button>
      <div style={{ flex: 1 }}/>
      {restore && (
        <button style={{
          border: 'none', background: 'transparent', color: t.accent,
          fontSize: 14, fontWeight: 600, cursor: 'pointer', padding: '0 12px', height: 40,

}

// Material plan-card: outlined, radio слева, tonal-заливка при выборе.
function AndroidPlanCard({ t, term, total, perMonth, badge, selected }) {
  return (
    <button style={{
      width: '100%', textAlign: 'left', cursor: 'pointer',
      background: selected ? t.accentSoft : t.surface, borderRadius: 16,
      border: `1.5px solid ${selected ? t.accent : t.border}`,

        width: 22, height: 22, borderRadius: 11, flexShrink: 0,

      <div style={{ fontFamily: M.fontMono, fontSize: 19, fontWeight: 700, color: t.text, letterSpacing: -0.5, whiteSpace: 'nowrap', flexShrink: 0 }}>{total} ₽</div>

}

function aPayCta(t) {
  return {
    width: '100%', height: 54, borderRadius: 16, border: 'none', cursor: 'pointer',
    background: t.cta, color: t.ctaInk, fontSize: 16, fontWeight: 700,

}

function APlanList({ t, selected }) {

    <div style={{ position: 'absolute', bottom: 0, left: 0, right: 0, zIndex: 50, padding: '0 16px 24px', background: t.bg }}>

      <div style={{ ...M.t.captionMuted(t), textAlign: 'center', marginTop: 10, lineHeight: 1.4 }}>{note}</div>

// ── Витрина тарифов (подписка не куплена) ───────────────────────
function AndroidPaywall({ dark = false, height = 1040, selected = 'year' }) {
  const t = dark ? M.dark : M.light;
  const ctaLabel = { month: 'Оформить за 199 ₽/мес', q: 'Оформить за 499 ₽', year: 'Оформить за 1 490 ₽/год' }[selected];

    <ADevice dark={dark} height={height}>

      <APinnedCta t={t} label={ctaLabel} note="Первые 20 маршрутов — бесплатно. Дальше добавление маршрутов — только по подписке."/>
    </ADevice>

}

// ── Активная подписка (управление). daysLeft → баннер «скоро истечёт» ──
function AndroidPaywallActive({ dark = false, height = 820, renewsOn = '14.02.2027', daysLeft = null }) {

  return (
    <ADevice dark={dark} height={height}>

          display: 'flex', alignItems: 'center', gap: 13, marginTop: 16,
          padding: '14px 16px', borderRadius: 16,
          background: hexToRgba(t.success, 0.10), border: `1px solid ${hexToRgba(t.success, 0.25)}`,
        }}>
          <div style={{
            width: 40, height: 40, borderRadius: 12, flexShrink: 0,
            background: hexToRgba(t.success, 0.16), color: t.success,
            display: 'flex', alignItems: 'center', justifyContent: 'center',

            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke={t.success} strokeWidth="2.6" strokeLinecap="round" strokeLinejoin="round"><path d="M5 12l5 5L20 7"/></svg>

            <div style={{ fontSize: 16, fontWeight: 700, color: t.text }}>Подписка активна</div>

              Действует до <span style={{ fontFamily: M.fontMono, color: t.text, fontWeight: 600 }}>{renewsOn}</span>
            </div>
          </div>
        </div>

        {daysLeft != null && (
          <div style={{
            marginTop: 10, padding: '14px 15px', borderRadius: 16,
            background: hexToRgba(t.warning, 0.10), border: `1px solid ${hexToRgba(t.warning, 0.30)}`,

// Material primary tabs (две вкладки с подчёркиванием).
function AAuthTabs({ t, value }) {

}

// Material filled text field: заливка bgSubtle, лейбл сверху, нижний индикатор.
function AFilledField({ t, icon, label, value, placeholder, focused, mono, trailing, error, errColor }) {
  const ec = errColor || t.danger;

    <div style={{

function AAuthBody({ t, mode, focus, error = false }) {
  const register = mode === 'register';
  const showErr = !register && error;
  const ec = t === M.dark ? '#FF6575' : '#C81E14';
  return (
    <React.Fragment>
      <div style={{ marginTop: 22 }}>

        <div style={{

      <div style={{ marginTop: showErr ? 16 : 20, display: 'flex', flexDirection: 'column', gap: 10 }}>

        <AFilledField
          t={t} icon={<IcLock/>} label="Пароль"

          trailing={<button style={{
            background: 'transparent', border: 'none', cursor: 'pointer', padding: 4,
            color: t.textMuted, display: 'flex', flexShrink: 0,
          }}><IcEyeOff width={20} height={20}/></button>}
        />
        {register && (
          <AFilledField t={t} icon={<IcLock/>} label="Повторите пароль" value="••••••••" placeholder="Ещё раз тот же пароль" focused={focus === 'password2'}/>
        )}
        {!register && (
          <div style={{ display: 'flex', justifyContent: 'flex-end', marginTop: 2 }}>

          </div>

      <button style={{ ...aAuthFilled(t), marginTop: register ? 18 : 16 }}>

      <AAuthDivider t={t}/>

}

function ARecoverBody({ t, focus }) {
  return (
    <React.Fragment>

function ASentBody({ t }) {

<script type="text/babel">
/* ===== stats-data.jsx ===== */
// stats-data.jsx — демо-данные раздела «Статистика»
// Один источник правды для всех концептов и состояний.
//
// Дельты бывают двух типов:
//   • kind:'norm'  — ОЦЕНОЧНАЯ. Сравнивается факт с нормой → семантический
//                    цвет (red = превышение нормы, green = в норме,
//                    neutral = норма не задана). Используем у «Переработки».
//   • kind:'info'  — ИНФОРМАЦИОННАЯ. Просто больше/меньше прошлого периода,
//                    рост не «хорошо» и не «плохо» → монохром (никогда не
//                    красим в red/green по знаку). Стрелка показывает только
//                    направление изменения.

// ── Формат крупных чисел (сокращаем: 1,2 млн · 3,4 тыс.) ──────────────
function fmtRu(n) {
  // разряды неразрывным пробелом
  return n.toLocaleString('ru-RU').replace(/\u00A0/g, ' ').replace(/,/g, ' ');
}
function fmtCompact(n) {
  const abs = Math.abs(n);
  if (abs >= 1e6) return (n / 1e6).toFixed(1).replace('.', ',') + ' млн';
  if (abs >= 1e4) return (n / 1e3).toFixed(1).replace('.', ',') + ' тыс.';
  if (abs >= 1e3) return fmtRu(n);
  return String(n);
}
// Часы из минут → «205:05» или «+30:05»
function fmtHM(min, signed) {
  const sign = min < 0 ? '−' : signed ? '+' : '';
  const a = Math.abs(min);
  const h = Math.floor(a / 60);
  const m = a % 60;
  return `${sign}${h}:${String(m).padStart(2, '0')}`;
}

// ── Метрики за МАРТ 2026 (текущий) vs ФЕВРАЛЬ 2026 (предыдущий) ────────
// value — отформатированная строка; unit — единица; delta — изменение.
const STAT_METRICS = {
  worked:   {
    key: 'worked', label: 'Отработанное время', short: 'Время',
    value: '187:20', unit: '', icon: 'clock',
    delta: { kind: 'info', dir: 'up', abs: '+12:05', pct: '+7%' },
    prevValue: '175:15',
  },
  overtime: {
    key: 'overtime', label: 'Переработка', short: 'Переработка',
    value: '+11:20', unit: '', icon: 'gauge',
    // ОЦЕНОЧНАЯ: факт 187:20 при норме 176:00 → превышение → red
    delta: { kind: 'norm', state: 'over', abs: 'норма 176:00', pct: '+6%' },
    prevValue: '−0:45',
  },
  distance: {
    key: 'distance', label: 'Расстояние', short: 'Путь',
    value: '3,4', unit: 'тыс. км', icon: 'route',
    delta: { kind: 'info', dir: 'up', abs: '+420 км', pct: '+14%' },
    prevValue: '3,0 тыс. км',
  },

<script type="text/babel">
/* ===== stats-ui.jsx ===== */
// stats-ui.jsx — примитивы раздела «Статистика»
// Все цвета через t, шрифты через M.fontSans/M.fontMono. hexToRgba — глобальный
// из shared-ui. Стиль-объекты именованы (suMetricChip и т.п.).

// ════════════════════════════════════════════════════════════════════
// 1. ИКОНКИ МЕТРИК (которых нет в icons.jsx)
// ════════════════════════════════════════════════════════════════════
const suIcoBase = { width: 22, height: 22, viewBox: '0 0 24 24', fill: 'none', stroke: 'currentColor', strokeWidth: 1.5, strokeLinecap: 'round', strokeLinejoin: 'round' };
function IcGauge(p){ return (<svg {...suIcoBase} {...p}><path d="M12 13l4-3"/><path d="M4.5 17a9 9 0 1 1 15 0"/><circle cx="12" cy="13" r="1.4" fill="currentColor" stroke="none"/></svg>); }
function IcRoute(p){ return (<svg {...suIcoBase} {...p}><circle cx="6" cy="18" r="2.4"/><circle cx="18" cy="6" r="2.4"/><path d="M8.4 18H14a3.5 3.5 0 0 0 0-7H10a3.5 3.5 0 0 1 0-7h5.6"/></svg>); }
function IcMoon(p){ return (<svg {...suIcoBase} {...p}><path d="M20 14.5A8 8 0 1 1 9.5 4a6.3 6.3 0 0 0 10.5 10.5z"/></svg>); }
function IcArrowUpRight(p){ return (<svg {...suIcoBase} {...p}><path d="M7 17L17 7M9 7h8v8"/></svg>); }
function IcSpeed(p){ return (<svg {...suIcoBase} {...p}><path d="M5 19a9 9 0 1 1 14 0"/><path d="M12 15l4.5-5.5"/><circle cx="12" cy="15" r="1.3" fill="currentColor" stroke="none"/></svg>); }
function IcSeat(p){ return (<svg {...suIcoBase} {...p}><path d="M6 4v8a2 2 0 0 0 2 2h6"/><path d="M6 12l-1 7"/><path d="M14 14l1.5 5"/><path d="M9 8h4"/></svg>); }
function IcChevronDown(p){ return (<svg {...suIcoBase} {...p}><path d="M6 9l6 6 6-6"/></svg>); }
function IcTimer(p){ return (<svg {...suIcoBase} {...p}><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2"/><path d="M9 2h6"/></svg>); }
function IcCompareOff(p){ return (<svg {...suIcoBase} {...p}><path d="M3 7h13M3 7l3-3M3 7l3 3"/><path d="M21 17H8m13 0l-3-3m3 3l-3 3"/><path d="M3 21L21 3" opacity="0.55"/></svg>); }

// Метрика → иконка
const SU_ICONS = {
  clock: (pr)=> <IcClock {...pr}/>,
  gauge: (pr)=> <IcGauge {...pr}/>,
  route: (pr)=> <IcRoute {...pr}/>,
  weight:(pr)=> <IcWeight {...pr}/>,
  moon:  (pr)=> <IcMoon {...pr}/>,
  doc:   (pr)=> <IcDocument {...pr}/>,
  ruble: (pr)=> <IcRuble {...pr}/>,
  speed: (pr)=> <IcSpeed {...pr}/>,
  seat:  (pr)=> <IcSeat {...pr}/>,
  timer: (pr)=> <IcTimer {...pr}/>,
};

// ════════════════════════════════════════════════════════════════════
// 2. ЦВЕТ ОЦЕНОЧНОЙ ДЕЛЬТЫ ПО НОРМЕ
// ════════════════════════════════════════════════════════════════════
// state: 'over' (превышение → danger) | 'ok' (в норме → success) | 'none' (нейтр.)
function normTone(t, state){
  if (state === 'over') return { color: t.danger, bg: hexToRgba(t.danger, 0.12) };
  if (state === 'ok')   return { color: t.success, bg: hexToRgba(t.success, 0.12) };
  return { color: t.textMuted, bg: t.bgSubtle };
}

// ════════════════════════════════════════════════════════════════════
// 3. ДЕЛЬТА-ЧИП
// ════════════════════════════════════════════════════════════════════
// Информационная дельта (kind:'info') — ВСЕГДА монохром (textMuted),
//   стрелка = только направление, без оценки «хорошо/плохо».
// Оценочная дельта (kind:'norm') — семантический цвет (red/green/neutral).
// variant: 'chip' (заливка) | 'plain' (без фона, для компактных строк)
function DeltaTag({ t, delta, variant = 'chip', size = 'md' }){
  const isNorm = delta.kind === 'norm';
  let color, bg, arrow;
  if (isNorm) {
    const tone = normTone(t, delta.state);
    color = tone.color; bg = tone.bg;
    arrow = delta.state === 'over' ? 'up' : delta.state === 'ok' ? 'down' : 'flat';
  } else {
    color = t.textMuted; bg = t.bgSubtle; arrow = delta.dir;
  }
  const fs = size === 'sm' ? 11 : 12;
  const main = delta.pct || delta.abs;
  return (
    <span style={{
      display: 'inline-flex', alignItems: 'center', gap: 3,
      padding: variant === 'chip' ? '3px 8px' : 0,
      borderRadius: M.r.pill,
      background: variant === 'chip' ? bg : 'transparent',
      color, fontFamily: M.fontMono, fontSize: fs, fontWeight: 700, letterSpacing: 0.2,
      whiteSpace: 'nowrap',
    }}>
      <DeltaArrow dir={arrow} size={size === 'sm' ? 9 : 10}/>
      {main}
    </span>
  );
}

// Стрелка направления (вверх/вниз/без изменений)
function DeltaArrow({ dir, size = 10 }){
  if (dir === 'flat') {
    return (<svg width={size} height={size} viewBox="0 0 12 12" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><path d="M2 6h8"/></svg>);
  }
  const up = dir === 'up';
  return (
    <svg width={size} height={size} viewBox="0 0 12 12" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"
      style={{ transform: up ? 'none' : 'rotate(180deg)' }}>
      <path d="M6 10V2M3 5l3-3 3 3"/>
    </svg>
  );
}

// Подпись «vs прошлый период» под дельтой
function DeltaSub({ t, children }){
  return <span style={{ fontFamily: M.fontSans, fontSize: 11, color: t.textFaint }}>{children}</span>;
}

// ════════════════════════════════════════════════════════════════════
// 4. ПЕРЕКЛЮЧАТЕЛЬ МЕСЯЦ / ГОД (segmented)
// ════════════════════════════════════════════════════════════════════
function PeriodSegment({ t, value = 'month', onChange }){
  const opts = [['month','Месяц'],['year','Год'],['all','История']];
  return (
    <div style={{ display: 'flex', gap: 4, padding: 4, background: t.bgSubtle, borderRadius: 12 }}>
      {opts.map(([k, label]) => {
        const active = k === value;
        return (
          <button key={k} onClick={()=>onChange&&onChange(k)} style={{
            flex: 1, textAlign: 'center', padding: '8px 0', borderRadius: 9, cursor: 'pointer',
            border: 'none', fontFamily: M.fontSans, fontSize: 14, fontWeight: 600,
            background: active ? t.surface : 'transparent',
            color: active ? t.text : t.textMuted,
            boxShadow: active ? M.shadow.sm : 'none',
          }}>{label}</button>
        );
      })}
    </div>
  );
}

// ════════════════════════════════════════════════════════════════════
// 5. НАВИГАЦИЯ ПО ПЕРИОДАМ  ← Март 2026 →
// ════════════════════════════════════════════════════════════════════
function PeriodNav({ t, label, sub, onPrev, onNext, nextDisabled }){
  const Btn = ({ dir, disabled }) => (
    <button onClick={dir==='prev'?onPrev:onNext} disabled={disabled} style={{
      width: 36, height: 36, borderRadius: 18, flexShrink: 0, cursor: disabled ? 'default' : 'pointer',
      background: 'transparent', border: 'none',
      color: disabled ? t.textFaint : t.text, opacity: disabled ? 0.4 : 1,
      display: 'flex', alignItems: 'center', justifyContent: 'center',
    }}>
      {dir==='prev' ? <IcChevronLeft width="20" height="20"/> : <IcChevronRight width="20" height="20"/>}
    </button>
  );
  return (
    <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
      <Btn dir="prev"/>
      <div style={{ textAlign: 'center' }}>
        <div style={{ fontFamily: M.fontSans, fontSize: 17, fontWeight: 700, color: t.text, letterSpacing: -0.2 }}>{label}</div>
        {sub && <div style={{ fontFamily: M.fontMono, fontSize: 11, color: t.textMuted, letterSpacing: 1, marginTop: 1 }}>{sub}</div>}
      </div>
      <Btn dir="next" disabled={nextDisabled}/>
    </div>
  );
}

// ════════════════════════════════════════════════════════════════════
// 5b. ВЫБОР ПЕРИОДА-ЭТАЛОНА ДЛЯ СРАВНЕНИЯ
// ════════════════════════════════════════════════════════════════════
// Тапабельная строка «в сравнении с …» — открывает шторку выбора.
// none=true — режим «без сравнения»: показываем только выбранный период.
function CompareSelector({ t, title, none, onOpen }){
  return (
    <div style={{ display: 'flex', alignItems: 'center', gap: 8, padding: '2px 2px 12px' }}>
      <span style={{ fontFamily: M.fontSans, fontSize: 12.5, color: t.textMuted, whiteSpace: 'nowrap' }}>
        {none ? 'режим' : 'в сравнении с'}
      </span>
      <button onClick={onOpen} style={{
        display: 'inline-flex', alignItems: 'center', gap: 5, padding: '5px 8px 5px 11px',
        borderRadius: M.r.pill, border: `1px solid ${none ? t.border : t.accent}`,
        background: none ? t.surface : t.accentSoft, cursor: 'pointer', boxShadow: M.shadow.sm,
      }}>

// 6. СПАРКЛАЙН (мини-линия динамики в карточке)
// ════════════════════════════════════════════════════════════════════
function Sparkline({ t, data, color, w = 96, h = 30, dot = true }){
  const min = Math.min(...data), max = Math.max(...data);
  const span = (max - min) || 1;
  const stepX = w / (data.length - 1);
  const pts = data.map((v, i) => [i * stepX, h - 3 - ((v - min) / span) * (h - 6)]);
  const d = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
  const c = color || t.accent;
  const last = pts[pts.length - 1];
  return (
    <svg width={w} height={h} viewBox={`0 0 ${w} ${h}`} style={{ display: 'block', overflow: 'visible' }}>
      <path d={d} fill="none" stroke={c} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/>
      {dot && <circle cx={last[0]} cy={last[1]} r="2.6" fill={c}/>}
    </svg>
  );
}

// 7. ПАРНЫЕ СТОЛБЦЫ «было / стало» (мини, внутри карточки)
// ════════════════════════════════════════════════════════════════════
// prev — приглушённый, cur — акцент (или семантика по норме).
function MiniPair({ t, prev, cur, curColor, h = 34 }){
  const max = Math.max(prev, cur) || 1;
  const c = curColor || t.accent;
  // Столбик «было» — нейтральный, но видимый в обеих темах (в тёмной
  // t.bgSubtle почти сливается с поверхностью, поэтому берём тон от текста).
  const prevFill = hexToRgba(t.text, 0.22);
  const Bar = ({ v, fill }) => (
    <div style={{ width: 12, height: h, display: 'flex', alignItems: 'flex-end' }}>
      <div style={{ width: '100%', height: `${Math.max(6,(v/max)*100)}%`, background: fill, borderRadius: 3 }}/>
    </div>
  );
  return (
    <div style={{ display: 'flex', alignItems: 'flex-end', gap: 5 }}>
      <Bar v={prev} fill={prevFill}/>
      <Bar v={cur} fill={c}/>
    </div>
  );
}

// 7b. ПЛАШКА МЕТРИКИ (прямоугольная карточка) — общая для «Месяц» и «Год»
// ════════════════════════════════════════════════════════════════════
// compare=false — режим без сравнения: прячем мини-пару, дельту и «было».
function MetricPlate({ t, icon, label, value, unit, prev, delta, spark, wide, compare = true }){
  const isNorm = delta && delta.kind === 'norm';
  const curColor = isNorm ? normTone(t, delta.state).color : t.accent;
  const sp = spark || [];
  const prevN = sp.length ? Math.abs(sp[sp.length - 2]) : 0;
  const curN = sp.length ? Math.abs(sp[sp.length - 1]) : 1;
  return (
    <div style={{ gridColumn: wide ? 'span 2' : 'span 1', background: t.surface, borderRadius: 18, boxShadow: M.shadow.sm, padding: 16 }}>
      <div style={{ display: 'flex', alignItems: 'center', gap: 8, color: t.textMuted, marginBottom: wide ? 10 : 12 }}>
        <span style={{ color: t.accent, display: 'flex' }}>{SU_ICONS[icon]({ width: 17, height: 17 })}</span>
        <span style={{ fontFamily: M.fontSans, fontSize: 12.5, fontWeight: 600, color: t.textMuted }}>{label}</span>
      </div>
      <div style={{ display: 'flex', alignItems: 'flex-end', justifyContent: 'space-between', gap: 8 }}>
        <div>
          <div style={{ fontFamily: M.fontMono, fontSize: wide ? 40 : 26, fontWeight: 800, color: t.text, letterSpacing: -1, lineHeight: 1, whiteSpace: 'nowrap' }}>{value}</div>
          {unit && <div style={{ fontFamily: M.fontMono, fontSize: 12, color: t.textMuted, marginTop: 4, whiteSpace: 'nowrap' }}>{unit}</div>}
        </div>
        {compare && spark && <MiniPair t={t} prev={prevN} cur={curN} curColor={curColor} h={wide ? 44 : 34}/>}
      </div>
      {compare && delta && (
        <div style={{ display: 'flex', alignItems: 'center', gap: 6, marginTop: 12 }}>
          <DeltaTag t={t} delta={delta} variant="plain" size="sm"/>
          {prev && <span style={{ fontFamily: M.fontSans, fontSize: 11, color: t.textFaint }}>было {prev}</span>}
        </div>
      )}
    </div>
  );
}

// Годовой ЛИНЕЙНЫЙ график (для концепта с линией динамики)
function YearLineChart({ t, months, h = 150 }){
  const w = 326;
  const all = months.flatMap(m => [m.cur, m.prev]);
  const min = Math.min(...all) * 0.96, max = Math.max(...all) * 1.02;
  const span = (max - min) || 1;
  const stepX = w / (months.length - 1);
  const toPts = (key) => months.map((m, i) => [i * stepX, h - ((m[key] - min) / span) * h]);
  const line = (pts) => pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
  const cur = toPts('cur'), prev = toPts('prev');
  return (
    <div>
      <div style={{ display: 'flex', gap: 16, marginBottom: 12 }}>
        <LegendLine t={t} color={t.accent} label="2026"/>
        <LegendLine t={t} color={t.borderStrong} label="2025" dashed/>
      </div>
      <svg width="100%" viewBox={`0 0 ${w} ${h + 18}`} style={{ display: 'block', overflow: 'visible' }}>
        <path d={line(prev)} fill="none" stroke={t.borderStrong} strokeWidth="2" strokeDasharray="4 4" strokeLinejoin="round" strokeLinecap="round"/>
        <path d={line(cur)} fill="none" stroke={t.accent} strokeWidth="2.4" strokeLinejoin="round" strokeLinecap="round"/>
        {cur.map((p, i) => i % 2 === 0 && (
          <text key={i} x={p[0]} y={h + 14} textAnchor="middle" fontFamily={M.fontMono} fontSize="8.5" fill={t.textFaint}>{months[i].m}</text>
        ))}
        <circle cx={cur[cur.length-1][0]} cy={cur[cur.length-1][1]} r="3" fill={t.accent}/>
      </svg>
    </div>
  );
}
function LegendLine({ t, color, label, dashed }){

// ════════════════════════════════════════════════════════════════════
// 10b. КРУГОВАЯ ДИАГРАММА (donut) + легенда строками
// ════════════════════════════════════════════════════════════════════
// Категориальная палитра — разные тона, чтобы секторы чётко различались.
// Синий-бренд ведёт, дальше — бирюза / янтарь / коралл / фиолет.
const DONUT_RAMP = ['#0079C2', '#17B0A8', '#F2A33C', '#E5683C', '#7C6CD6'];

// segments: [{ label, value, sub?, color? }]
// centerMain / centerSub — крупная подпись в центре кольца.
function DonutChart({ t, segments, size = 150, thickness = 26, gap = 3, centerMain, centerSub }){
  const total = segments.reduce((s, x) => s + x.value, 0) || 1;
  const r = (size - thickness) / 2;
  const circ = 2 * Math.PI * r;
  const cx = size / 2;
  let acc = 0;
  return (
    <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`} style={{ flexShrink: 0, display: 'block' }}>
      <circle cx={cx} cy={cx} r={r} fill="none" stroke={t.bgSubtle} strokeWidth={thickness}/>
      <g transform={`rotate(-90 ${cx} ${cx})`}>
        {segments.map((s, i) => {
          const frac = s.value / total;
          const seg = frac * circ;
          const dash = Math.max(0.6, seg - gap);
          const offset = -acc * circ;
          acc += frac;
          return (
            <circle key={i} cx={cx} cy={cx} r={r} fill="none"
              stroke={s.color || DONUT_RAMP[i % DONUT_RAMP.length]}
              strokeWidth={thickness} strokeLinecap="butt"
              strokeDasharray={`${dash} ${circ - dash}`}
              strokeDashoffset={offset}/>
          );
        })}
      </g>
      {centerMain && (
        <text x={cx} y={cx - 2} textAnchor="middle" fontFamily={M.fontMono} fontSize={size > 130 ? 21 : 17} fontWeight="800" fill={t.text} letterSpacing="-0.5">{centerMain}</text>
      )}
      {centerSub && (
        <text x={cx} y={cx + (size > 130 ? 16 : 14)} textAnchor="middle" fontFamily={M.fontSans} fontSize="10.5" fill={t.textMuted}>{centerSub}</text>
      )}
    </svg>
  );
}

// Легенда-строки к donut: цветной маркер · подпись · значение
function DonutLegend({ t, segments, fmtVal }){
  const total = segments.reduce((s, x) => s + x.value, 0) || 1;
  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: 11, flex: 1, minWidth: 0 }}>
      {segments.map((s, i) => {
        const pct = Math.round((s.value / total) * 100);
        return (
          <div key={i} style={{ display: 'flex', alignItems: 'center', gap: 9, minWidth: 0 }}>
            <span style={{ width: 9, height: 9, borderRadius: 3, flexShrink: 0, background: s.color || DONUT_RAMP[i % DONUT_RAMP.length] }}/>
            <div style={{ flex: 1, minWidth: 0 }}>
              <div style={{ fontFamily: M.fontSans, fontSize: 13, fontWeight: 600, color: t.text, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{s.label}</div>

            </div>
            <span style={{ fontFamily: M.fontMono, fontSize: 13, fontWeight: 700, color: t.text, whiteSpace: 'nowrap' }}>{pct}<span style={{ color: t.textFaint, fontWeight: 500 }}>%</span></span>
          </div>
        );
      })}
    </div>
  );
}

// Легенда-строки на всю ширину: маркер · полная подпись (не обрезается) · доля
function DonutLegendRows({ t, segments }){
  const total = segments.reduce((s, x) => s + x.value, 0) || 1;
  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: 2 }}>
      {segments.map((s, i) => {
        const pct = Math.round((s.value / total) * 100);
        return (
          <div key={i} style={{ display: 'flex', alignItems: 'center', gap: 10, padding: '9px 0', borderTop: i ? `1px solid ${t.border}` : 'none' }}>
            <span style={{ width: 11, height: 11, borderRadius: 3, flexShrink: 0, background: s.color || DONUT_RAMP[i % DONUT_RAMP.length] }}/>
            <div style={{ flex: 1, minWidth: 0 }}>
              <div style={{ fontFamily: M.fontSans, fontSize: 13.5, fontWeight: 600, color: t.text, lineHeight: 1.25 }}>{s.label}</div>
              {s.sub && <div style={{ fontFamily: M.fontMono, fontSize: 10.5, color: t.textFaint, marginTop: 2 }}>{s.sub}</div>}
            </div>
            <span style={{ fontFamily: M.fontMono, fontSize: 14, fontWeight: 700, color: t.text, whiteSpace: 'nowrap' }}>{pct}<span style={{ color: t.textFaint, fontWeight: 500 }}>%</span></span>
          </div>
        );
      })}
    </div>
  );
}

// Готовый блок «donut + легенда»: кольцо по центру сверху, расшифровка ниже на всю ширину
function DonutBreakdown({ t, segments, centerMain, centerSub, size = 150 }){
  return (
    <div style={{ padding: '14px 2px 6px' }}>
      <div style={{ display: 'flex', justifyContent: 'center', marginBottom: 16 }}>
        <DonutChart t={t} segments={segments} size={size} thickness={26} centerMain={centerMain} centerSub={centerSub}/>
      </div>
      <DonutLegendRows t={t} segments={segments}/>
    </div>
  );
}

// ════════════════════════════════════════════════════════════════════
// 11. ЛЕГЕНДА ЦВЕТОВОЙ ЛОГИКИ ДЕЛЬТ
// ════════════════════════════════════════════════════════════════════
function DeltaLegend({ t }){
  const Item = ({ color, bg, title, desc, arrow }) => (
    <div style={{ display: 'flex', alignItems: 'flex-start', gap: 12, padding: '12px 0' }}>
      <span style={{
        display: 'inline-flex', alignItems: 'center', gap: 3, padding: '3px 8px', borderRadius: M.r.pill,
        background: bg, color, fontFamily: M.fontMono, fontSize: 12, fontWeight: 700, flexShrink: 0, marginTop: 1,
      }}>
        {arrow !== 'none' && <DeltaArrow dir={arrow} size={10}/>}
        {arrow === 'none' ? '—' : '+6%'}
      </span>
      <div>
        <div style={{ fontFamily: M.fontSans, fontSize: 14, fontWeight: 600, color: t.text }}>{title}</div>
        <div style={{ fontFamily: M.fontSans, fontSize: 12.5, color: t.textMuted, lineHeight: 1.4, marginTop: 2 }}>{desc}</div>
      </div>
    </div>
  );
  return (
    <div>
      <Item color={t.danger} bg={hexToRgba(t.danger,0.12)} arrow="up"
        title="Превышение нормы" desc="Оценочная дельта: факт больше нормы за период."/>
      <div style={{ height: 1, background: t.border }}/>
      <Item color={t.success} bg={hexToRgba(t.success,0.12)} arrow="down"
        title="В пределах нормы" desc="Оценочная дельта: факт не превышает норму."/>
      <div style={{ height: 1, background: t.border }}/>
      <Item color={t.textMuted} bg={t.bgSubtle} arrow="up"
        title="Информационная дельта" desc="Путь, ткм, ночные: просто больше / меньше прошлого периода. Цветом не оцениваем."/>
    </div>
  );
}

// Полоса «норма vs факт» — единый стиль с виджетом: заполнение до нормы
// (accent) + хвост переработки (warning) с засечкой; подписи по краям.
function NormBar({ t, norm, fact, unit }){
  const over = fact >= norm;
  const total = Math.max(norm, fact);
  const accentPct = (Math.min(norm, fact) / total) * 100;
  const warnPct = over ? ((fact - norm) / total) * 100 : 0;
  const factColor = over ? t.danger : t.success;
  return (
    <div>
      <div style={{ position: 'relative', height: 18, background: t.bgSubtle, borderRadius: 9, overflow: 'hidden' }}>
        <div style={{ position: 'absolute', top: 0, bottom: 0, left: 0, width: `${accentPct}%`, background: t.accent }}/>
        {over && <div style={{ position: 'absolute', top: 0, bottom: 0, left: `${accentPct}%`, width: `${warnPct}%`, background: t.danger }}/>}
        {over && <div style={{ position: 'absolute', top: 0, bottom: 0, left: `${accentPct}%`, width: 2, background: t.bgElevated, transform: 'translateX(-1px)' }}/>}
      </div>
      <div style={{ marginTop: 7, display: 'flex', alignItems: 'baseline', justifyContent: 'space-between', gap: 12 }}>
        <span style={{ fontFamily: M.fontMono, fontSize: 11.5, color: t.textMuted, whiteSpace: 'nowrap' }}>
          норма <span style={{ color: t.text, fontWeight: 600 }}>{norm}{unit ? ` ${unit}` : ''}</span>
        </span>
        <span style={{ fontFamily: M.fontMono, fontSize: 11.5, fontWeight: 700, color: factColor, whiteSpace: 'nowrap' }}>
          факт {fact}{unit ? ` ${unit}` : ''}
        </span>
      </div>
    </div>
  );
}

// Интерактивный помесячный график: один ряд столбцов, выбранный — акцентом.
function MonthBars({ t, data, sel, onSelect, h = 168 }){
  const max = Math.max(...data.map(d => d.v)) * 1.12;
  return (
    <div style={{ display: 'flex', alignItems: 'flex-end', gap: 3, height: h }}>
      {data.map((d, i) => {

        return (

            <span style={{
              width: '100%', maxWidth: 22, height: `${(d.v/max)*100}%`, borderRadius: '5px 5px 0 0',
              background: active ? t.accent : hexToRgba(t.accent, 0.18),
            }}/>
            <span style={{ fontFamily: M.fontMono, fontSize: 9.5, fontWeight: active ? 800 : 500, color: active ? t.text : t.textFaint, marginTop: 7 }}>{d.sh}</span>
          </button>

}

function IOSStatsDetail({ height = 1100, metric = 'distance', dark = false, platform = 'ios' }){
  const t = dark ? M.dark : M.light;
  const m = STAT_METRICS[metric];
  const [sel, setSel] = React.useState(DETAIL_DIST.length - 1); // по умолчанию — март 2026
  const cur = DETAIL_DIST[sel];
  const prev = sel > 0 ? DETAIL_DIST[sel - 1] : null;
  const diff = prev ? cur.v - prev.v : 0;
  const delta = prev ? {
    kind: 'info',
    dir: Math.abs(diff) < 0.05 ? 'flat' : diff > 0 ? 'up' : 'down',
    pct: `${diff >= 0 ? '+' : '−'}${Math.abs(Math.round((diff / prev.v) * 100))}%`,
    abs: `${diff >= 0 ? '+' : '−'}${Math.abs(Math.round(diff * 1000))} км`,
  } : null;
  // разбивка пути по роду движения, пропорционально выбранному месяцу
  const freight = +(cur.v * 0.64).toFixed(1), passenger = +(cur.v * 0.22).toFixed(1), reserve = +(cur.v - freight - passenger).toFixed(1);
  return (
    <MDevice dark={dark} platform={platform} height={height}>

// ════════════════════════════════════════════════════════════════════
function IOSStatsHistory({ height = 1380, metric = 'worked', dark = false, platform = 'ios' }){
  const t = dark ? M.dark : M.light;
  // Активная метрика управляет крупным итогом и блоком «Год за годом».
  const cfg = HISTORY_METRICS.find(m => m.key === metric) || HISTORY_METRICS[0];
  const total = YEAR_HISTORY.reduce((s, y) => s + y[cfg.field], 0);
  const totRoutes = YEAR_HISTORY.reduce((s, y) => s + y.routes, 0);
  // Столбцы нормируем на максимум года по выбранной метрике → лучший год = вся ширина.

  return [
    <DCArtboard key={k('month')} id={k('month')} label={`Месяц · сетка плашек${th}`} width={390} height={Hmonth}>
      <IOSStatsB platform={platform} dark={dark} height={Hmonth}/>

    </DCArtboard>,

    <DCArtboard key={k('year')} id={k('year')} label={`Год · плашки метрик${th}`} width={390} height={Hyear}>
      <IOSStatsYear platform={platform} dark={dark} height={Hyear}/>

      <IOSStatsYear platform={platform} dark={dark} height={Hyear} initialCmp="none"/>

<script type="text/babel">
/* ===== salary-settings.jsx ===== */
// ════════════════════════════════════════════════════════════════
// ПОДЭКРАН НАСТРОЙКИ · ЗАРПЛАТА (тарифы и параметры расчёта)
//   Открывается из Настройки → Расчёт → «Зарплата».
//   Это форма ВВОДА параметров (ставки, надбавки, удержания),
//   из которых потом считается экран «Зарплата» (salary-screen).
//
//   Исходные Samsung-скрины переведены в общий стиль приложения:
//   • секции «Начисления» / «Удержания» — крупный SecH (как в расчётном
//     экране ЗП), а не системный right-aligned заголовок;
//   • поля — label сверху + единый инпут (mono-значение + единица справа);
//   • iOS: инпут с тонким контуром; Android: filled bgSubtle (Material);
//   • пороговые доплаты (тяж./длинносост./удлин. плечо) — два поля
//     [порог + единица] [%] и ссылка «Добавить» для второго порога;
//   • дата начала действия тарифа — accent-ссылка, открывает date-sheet.
// ════════════════════════════════════════════════════════════════

// Маленькая accent-ссылка (дата тарифа / «Добавить»)
function salLink(t) {
  return {
    background: 'transparent', border: 'none', color: t.accent,
    fontFamily: M.fontSans, fontSize: 13, fontWeight: 600,
    cursor: 'pointer', padding: 0, whiteSpace: 'nowrap',
  };
}

// Единый инпут поля ЗП: mono-значение слева, единица справа.
// mat=true → filled (Material), иначе bordered (iOS).
function PaySetInput({ t, value, unit, mat }) {
  const has = value !== '' && value != null;
  return (
    <div style={{
      display: 'flex', alignItems: 'center', justifyContent: 'space-between', gap: 8,
      minHeight: 46, padding: '0 14px', borderRadius: M.r.input, boxSizing: 'border-box',
      background: mat ? t.bgSubtle : 'transparent',
      border: mat ? '1px solid transparent' : `1px solid ${t.border}`,
    }}>
      <span style={{
        fontFamily: M.fontMono, fontSize: 17, fontWeight: 600,
        color: has ? t.text : t.textFaint,
      }}>{has ? value : '0'}</span>
      {unit && (
        <span style={{
          fontFamily: M.fontSans, fontSize: 14, fontWeight: 500, color: t.textMuted, flexShrink: 0,
        }}>{unit}</span>
      )}
    </div>
  );
}

// Поле: label (+ опц. action справа) сверху, инпут снизу.
function PaySetField({ t, label, value, unit, action, mat }) {
  return (
    <div style={{ padding: '12px 16px 14px' }}>
      <div style={{
        display: 'flex', alignItems: 'baseline', justifyContent: 'space-between',
        gap: 10, marginBottom: 8,
      }}>
        <div style={{ ...M.t.label(t), fontSize: 13, color: t.textMuted }}>{label}</div>
        {action}
      </div>
      <PaySetInput t={t} value={value} unit={unit} mat={mat}/>
    </div>
  );
}

// Пороговая доплата: [порог + ед.] [%] + ссылка «Добавить».
function PaySetTier({ t, label, threshold, thUnit, percent, mat }) {
  return (
    <div style={{ padding: '12px 16px 14px' }}>
      <div style={{
        display: 'flex', alignItems: 'baseline', justifyContent: 'space-between',
        gap: 10, marginBottom: 8,
      }}>
        <div style={{ ...M.t.label(t), fontSize: 13, color: t.textMuted }}>{label}</div>
        <button style={salLink(t)}>Добавить</button>
      </div>
      <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 10 }}>
        <PaySetInput t={t} value={threshold} unit={thUnit} mat={mat}/>
        <PaySetInput t={t} value={percent} unit="%" mat={mat}/>
      </div>
    </div>
  );
}

// ── Контент формы (общий для iOS и Android) ─────────────────────
const SAL_NADBAVKI = [
  ['Зональная надбавка', '25'],
  ['Доплаты за класс и права', '0'],
  ['Работа в одно лицо · грузовой', '40'],
  ['Работа в одно лицо · пассажирский', '50'],
  ['Доплата за вредность', '0'],
  ['Северная надбавка', '0'],
  ['Районный коэффициент', '0'],
];
const SAL_TIERS = [
  ['Доплата за тяжёлые поезда', '5000', 'т', '9'],
  ['Доплата за длинносоставные поезда', '57', 'ваг', '5'],
  ['Доплата за удлинённое плечо', '250', 'км', '10'],
];
const SAL_UDER = [
  ['Подоходный налог · НДФЛ', '13'],
  ['Профсоюз', '1'],
  ['Прочие удержания', '0'],
];

function SalSettingsBody({ t, mat }) {
  const CardC = mat ? MCard : Card;
  const inset = mat ? 0 : 16;
  const gap = (h) => <div style={{ height: h }}/>;
  const dateLink = <button style={salLink(t)}>с 1 июня 2026</button>;

  return (
    <React.Fragment>
      {/* ── НАЧИСЛЕНИЯ ── */}
      <SecH t={t}>Начисления</SecH>

      <CardC t={t}>
        <PaySetField t={t} mat={mat} label="Тарифная ставка" value="375" unit="₽" action={dateLink}/>
        <Sep t={t} inset={inset}/>
        <PaySetField t={t} mat={mat} label="Средний час" value="0" unit="₽"/>
      </CardC>

      {gap(12)}
      <CardC t={t}>
        {SAL_NADBAVKI.map(([label, val], i) => (
          <React.Fragment key={label}>
            {i > 0 && <Sep t={t} inset={inset}/>}
            <PaySetField t={t} mat={mat} label={label} value={val} unit="%"/>
          </React.Fragment>
        ))}
      </CardC>

      {gap(12)}
      <CardC t={t}>
        {SAL_TIERS.map(([label, th, unit, pct], i) => (
          <React.Fragment key={label}>
            {i > 0 && <Sep t={t} inset={inset}/>}
            <PaySetTier t={t} mat={mat} label={label} threshold={th} thUnit={unit} percent={pct}/>
          </React.Fragment>
        ))}
      </CardC>
      <SectionNote t={t}>
        Надбавка начисляется, когда показатель поезда превышает порог. «Добавить» — задать ещё один порог со своим процентом.
      </SectionNote>

      {gap(12)}
      <CardC t={t}>
        <PaySetField t={t} mat={mat} label="Другие надбавки" value="0" unit="%"/>
      </CardC>

      {/* ── УДЕРЖАНИЯ ── */}
      <SecH t={t}>Удержания</SecH>
      <CardC t={t}>
        {SAL_UDER.map(([label, val], i) => (
          <React.Fragment key={label}>
            {i > 0 && <Sep t={t} inset={inset}/>}
            <PaySetField t={t} mat={mat} label={label} value={val} unit="%"/>
          </React.Fragment>
        ))}
      </CardC>
    </React.Fragment>
  );
}

// ── Date-sheet: дата начала действия нового тарифа ──────────────
